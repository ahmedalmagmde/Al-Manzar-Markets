<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أسواق المنظر | Al Manzar Markets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .float-anim { animation: float 3s ease-in-out infinite; }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
    }
    .pulse-btn { animation: pulse-green 2s infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-emerald-50 via-green-50 to-emerald-100 flex items-center justify-center p-4 relative">

  <!-- Language Switcher - Top Right Corner -->
  <button onclick="toggleLang()" id="lang-btn" class="fixed top-4 right-4 z-50 bg-white/90 backdrop-blur border border-emerald-200 text-emerald-700 px-4 py-2 rounded-full font-bold shadow-md hover:shadow-lg transition-all hover:scale-105 text-sm">
    <span id="lang-text">English</span>
  </button>

  <div class="max-w-md w-full text-center pt-8">

    <!-- Logo / Icon -->
    <div class="float-anim inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-emerald-600 text-white text-5xl mb-6 shadow-2xl">
      🛒
    </div>

    <!-- Store Name -->
    <h1 class="text-5xl font-extrabold text-emerald-900 mb-3 tracking-tight" id="store-name">أسواق المنظر</h1>
    <p class="text-emerald-600 text-lg mb-10" id="tagline">كل احتياجاتك اليومية في مكان واحد</p>

    <!-- Location Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-emerald-100 p-5 mb-6 text-right" id="location-card">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-xl shrink-0">
          📍
        </div>
        <div>
          <h3 class="font-bold text-emerald-900" id="loc-title">موقع المحل</h3>
          <p class="text-gray-400 text-xs" id="loc-sub">تقدر تزورنا على الخريطة</p>
        </div>
      </div>
      <a href="https://maps.app.goo.gl/TYAYNCC6JaU3nHkMA" target="_blank" class="block w-full bg-gray-50 hover:bg-gray-100 text-emerald-700 text-center py-3 rounded-xl font-bold transition-all border border-gray-200" id="loc-btn">
        🗺️ افتح الموقع على Google Maps
      </a>
    </div>

    <!-- WhatsApp Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-emerald-100 p-5 mb-8">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-xl shrink-0">
          📱
        </div>
        <div class="text-right">
          <h3 class="font-bold text-emerald-900" id="contact-title">رقم التواصل</h3>
          <p class="text-gray-500 text-sm">050 308 0315</p>
        </div>
      </div>

      <a href="https://wa.me/966503080315?text=👋%20مرحباً%20أسواق%20المنظر%0A🛒%20عندي%20طلب%20جديد%0A📍%20يرجى%20تأكيد%20العنوان%20والتوصيل" target="_blank" class="pulse-btn block w-full bg-emerald-600 hover:bg-emerald-700 text-white text-center py-4 rounded-xl font-extrabold text-lg shadow-xl transition-all hover:scale-105 flex items-center justify-center gap-2" id="wa-btn">
        <span class="text-2xl">💬</span>
        <span id="wa-text">اطلب الآن عبر الواتساب</span>
      </a>
      <p class="text-gray-400 text-xs mt-3" id="wa-hint">اضغط وافتح تطبيق الواتساب مباشرة</p>
    </div>

    <!-- Footer -->
    <p class="text-emerald-700/50 text-sm" id="footer">© 2026 أسواق المنظر</p>
  </div>

  <script>
    let currentLang = 'ar';

    const translations = {
      ar: {
        langText: 'English',
        storeName: 'أسواق المنظر',
        tagline: 'كل احتياجاتك اليومية في مكان واحد',
        locTitle: 'موقع المحل',
        locSub: 'تقدر تزورنا على الخريطة',
        locBtn: '🗺️ افتح الموقع على Google Maps',
        contactTitle: 'رقم التواصل',
        waText: 'اطلب الآن عبر الواتساب',
        waHint: 'اضغط وافتح تطبيق الواتساب مباشرة',
        footer: '© 2026 أسواق المنظر',
        waMsg: '👋 مرحباً أسواق المنظر
🛒 عندي طلب جديد
📍 يرجى تأكيد العنوان والتوصيل',
        dir: 'rtl'
      },
      en: {
        langText: 'العربية',
        storeName: 'Al Manzar Markets',
        tagline: 'All your daily needs in one place',
        locTitle: 'Our Location',
        locSub: 'Visit us on the map',
        locBtn: '🗺️ Open on Google Maps',
        contactTitle: 'Contact Number',
        waText: 'Order Now via WhatsApp',
        waHint: 'Click to open WhatsApp directly',
        footer: '© 2026 Al Manzar Markets',
        waMsg: '👋 Hello Al Manzar Markets
🛒 I have a new order
📍 Please confirm address & delivery',
        dir: 'ltr'
      }
    };

    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const t = translations[currentLang];

      document.documentElement.lang = currentLang;
      document.documentElement.dir = t.dir;

      document.getElementById('lang-text').textContent = t.langText;
      document.getElementById('store-name').textContent = t.storeName;
      document.getElementById('tagline').textContent = t.tagline;
      document.getElementById('loc-title').textContent = t.locTitle;
      document.getElementById('loc-sub').textContent = t.locSub;
      document.getElementById('loc-btn').textContent = t.locBtn;
      document.getElementById('contact-title').textContent = t.contactTitle;
      document.getElementById('wa-text').textContent = t.waText;
      document.getElementById('wa-hint').textContent = t.waHint;
      document.getElementById('footer').textContent = t.footer;

      const waLink = document.getElementById('wa-btn');
      waLink.href = `https://wa.me/966503080315?text=${encodeURIComponent(t.waMsg)}`;

      const locCard = document.getElementById('location-card');
      if (currentLang === 'en') {
        locCard.classList.remove('text-right');
        locCard.classList.add('text-left');
      } else {
        locCard.classList.remove('text-left');
        locCard.classList.add('text-right');
      }
    }
  </script>
</body>
</html>
